# PYNQ-Z2 выбран только как запись с тем же XC7Z020-1CLG400 в базе Apio.
# Все назначения выводов задаются нашим файлом constraints/probe.xdc.
[env:default]
board = pynq-z2
top-module = top
constraint-file = constraints/probe.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 80 --log _build/default/timing.log --write _build/default/hardware.routed.json
# DSP48E1 заданы явно в RTL; автоматическое создание других DSP отключено.
# -nowidelut исключает широкие MUXF7/8 при размещении программируемой сети.
yosys-extra-options = -nodsp -nowidelut

[env:probe]
board = pynq-z2
top-module = dpu_probe_top
constraint-file = constraints/probe.xdc
nextpnr-extra-options = --write _build/probe/hardware.routed.json
verilator-extra-options = scripts/xilinx_lint.vlt
# DSP задаются явно в RTL. Другие умножения в этом опыте не нужны.
yosys-extra-options = -nodsp

[env:grid]
board = pynq-z2
top-module = grid_top
constraint-file = constraints/grid.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 125 --log _build/grid/timing.log --write _build/grid/hardware.routed.json
yosys-extra-options = -nodsp -nowidelut -nosrl

[env:grid-safe]
board = pynq-z2
top-module = grid_top
constraint-file = constraints/grid_safe.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 80 --log _build/grid-safe/timing.log --write _build/grid-safe/hardware.routed.json
yosys-extra-options = -nodsp -nowidelut -nosrl


# Отдельный профиль загружаемых локальных графов; прежний контроль остаётся grid-safe.
[env:field]
board = pynq-z2
top-module = field_top
constraint-file = constraints/grid_safe.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 80 --log _build/field/timing.log --write _build/field/hardware.routed.json --placer heap
yosys-extra-options = -nodsp -nowidelut -nosrl

# Тот же фиксированный закон GRD1, источник тактов — FCLK0 из PS.
[env:grid-fclk]
board = pynq-z2
top-module = grid_fclk_top
constraint-file = constraints/grid_fclk.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 100 --log _build/grid-fclk/timing.log --write _build/grid-fclk/hardware.routed.json
yosys-extra-options = -nodsp -nowidelut -nosrl

# Восемь фиксированных трактов; сборка через build_field.py проверяет 128 DSP.
[env:grid-fclk8]
board = pynq-z2
top-module = grid_fclk8_top
constraint-file = constraints/grid_fclk.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 100 --log _build/grid-fclk8/timing.log --write _build/grid-fclk8/hardware.routed.json
yosys-extra-options = -nodsp -nowidelut -nosrl

# Восемь фиксированных трактов без настройки PS; CFGMCLK измеряется на плате.
[env:grid8-safe]
board = pynq-z2
top-module = grid8_top
constraint-file = constraints/grid8_safe.xdc
verilator-extra-options = scripts/xilinx_lint.vlt
nextpnr-extra-options = --freq 70 --log _build/grid8-safe/timing.log --write _build/grid8-safe/hardware.routed.json
yosys-extra-options = -nodsp -nowidelut -nosrl
