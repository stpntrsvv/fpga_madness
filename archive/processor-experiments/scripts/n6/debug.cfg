# STLINK подключён только к N6; DAPLink/Zynq этот сценарий не использует.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
if {[info exists N6_SERIAL]} { adapter serial $N6_SERIAL }
adapter speed 1000
source [find target/swj-dp.tcl]
swj_newdap n6 cpu -irlen 4 -expected-id 0x6ba02477
dap create n6.dap -chain-position n6.cpu
target create n6.ap0 mem_ap -dap n6.dap -ap-num 0
target create n6.ap1 mem_ap -dap n6.dap -ap-num 1
# Полный доступ к процессору включается только разрешённым режимом хоста.
if {[info exists N6_RUN] && $N6_RUN} {
 target create n6.cpu cortex_m -dap n6.dap -ap-num 1
 # Обработчиков examine-end с записью DBGMCU здесь нет.
}
gdb_port disabled
telnet_port disabled
bindto 127.0.0.1
init
# AP0 — отдельная отладочная шина; SRAM и периферия доступны через AP1.
n6.dap apsel 1
n6.dap apcsw 0x0b000000 0x4f000000
